name: Test library-backend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install library-backend dependencies
        working-directory: ./part_8/fs-graphql/library-backend
        run: npm ci

      - name: Install test dependencies
        working-directory: ./part_8/fs-graphql/tests-chapter4
        run: npm ci

      - name: Run tests
        working-directory: ./part_8/fs-graphql/tests-chapter4
        run: npm test

env:
  JWT_SECRET: "test_secret"
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
